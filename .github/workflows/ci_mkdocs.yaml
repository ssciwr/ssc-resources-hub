name: ci

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

env:
  UV_VERSION: "0.11.32"

jobs:
  validate:
    name: Curriculum tests and documentation build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install "uv==$UV_VERSION"
      - name: Install locked documentation and test dependencies
        run: uv sync --locked --extra docs --group dev
      - name: Validate curriculum
        run: uv run --no-sync pytest tests/ai-roadmap -m "not browser" -q
      - name: Build documentation
        run: uv run --no-sync mkdocs build
      - name: Install browser and system dependencies
        run: uv run --no-sync playwright install --with-deps chromium
      - name: Run browser regression tests against the built site
        run: >-
          uv run --no-sync pytest tests/ai-roadmap -m browser -q
          --roadmap-site-dir site --browser chromium
          --tracing retain-on-failure --screenshot only-on-failure
          --output test-results/ai-roadmap
      - name: Upload browser failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ai-roadmap-browser-failures
          path: test-results/ai-roadmap/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: github-pages-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install "uv==$UV_VERSION"
      - name: Install locked documentation and test dependencies
        run: uv sync --locked --extra docs --group dev
      - name: Configure Git credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Deploy documentation
        run: uv run --no-sync mkdocs gh-deploy --force
